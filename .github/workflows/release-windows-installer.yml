name: Release Windows Installer Asset

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-asset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release bundle
        run: |
          mkdir -p dist-release
          rsync -a . dist-release/spark-curiosity \
            --exclude .git \
            --exclude node_modules \
            --exclude dist \
            --exclude "*.log"
          cd dist-release
          zip -r spark-curiosity-windows.zip spark-curiosity

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/spark-curiosity-windows.zip

      - name: Publish to public dist repo
        if: ${{ secrets.DIST_REPO_TOKEN != '' && secrets.DIST_REPO_SLUG != '' }}
        env:
          DIST_REPO_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
          DIST_REPO_SLUG: ${{ secrets.DIST_REPO_SLUG }}
        run: |
          set -euo pipefail
          git config --global user.name "spark-ci"
          git config --global user.email "spark-ci@users.noreply.github.com"

          DIST_URL="https://x-access-token:${DIST_REPO_TOKEN}@github.com/${DIST_REPO_SLUG}.git"
          git clone "$DIST_URL" dist-repo

          mkdir -p dist-repo/windows
          cp dist-release/spark-curiosity-windows.zip dist-repo/windows/spark-curiosity-windows.zip

          DIST_BASE_URL="https://raw.githubusercontent.com/${DIST_REPO_SLUG}/main/windows"
          sed "s|__DIST_BASE_URL__|${DIST_BASE_URL}|g" scripts/windows/dist-install-template.ps1 > dist-repo/install.ps1

          VERSION="${GITHUB_REF_NAME:-manual}"
          SHA="${GITHUB_SHA}"
          DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          cat > dist-repo/manifest.json <<EOF
          {
            "version": "${VERSION}",
            "source_sha": "${SHA}",
            "updated_at_utc": "${DATE}",
            "asset": "windows/spark-curiosity-windows.zip"
          }
          EOF

          pushd dist-repo >/dev/null
          git add install.ps1 manifest.json windows/spark-curiosity-windows.zip
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Publish Windows installer ${VERSION}"
          git push origin HEAD:main
          popd >/dev/null
