name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.1). Used only for manual runs without a git tag."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build SparkSetup.exe
        shell: pwsh
        env:
          SPARK_GROK_API_KEY: ""
          SPARK_CLOUD_PROXY_URL: https://spark-proxy.spark-curiosity.workers.dev
        run: |
          npm ci --ignore-scripts
          npm run test:companion
          & "$env:GITHUB_WORKSPACE\scripts\build-installer.ps1"
          if (-not (Test-Path "dist-installer\SparkSetup.exe")) {
            throw "dist-installer\SparkSetup.exe was not produced"
          }

      - name: Zip portable Windows bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Compress-Archive -Path "dist-package\*" -DestinationPath "dist-release\spark-curiosity-windows.zip" -Force
          Copy-Item "dist-installer\SparkSetup.exe" "dist-release\SparkSetup.exe" -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist-release/

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare google-services.json for CI build
        run: cp apps/android/app/google-services.json.example apps/android/app/google-services.json

      - name: Build debug APK
        working-directory: apps/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon -q

      - name: Stage APK
        run: |
          mkdir -p dist-release
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk dist-release/spark-curiosity-android.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist-release/spark-curiosity-android.apk

  publish:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing release: $TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Spark Curiosity ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/windows/SparkSetup.exe
            artifacts/windows/spark-curiosity-windows.zip
            artifacts/android/spark-curiosity-android.apk
          overwrite_files: true
