name = "spark-proxy"
main = "src/index.ts"
compatibility_date = "2025-03-01"

# KV namespace for installation tokens
[[kv_namespaces]]
binding = "TOKENS"
id = "8fac1cacc8b04750abfaa16cc915cb0a"

# Workers AI binding — call Cloudflare AI models directly (no API token needed)
[ai]
binding = "AI"

# Set via `wrangler secret put XAI_API_KEY` (fallback for non-CF models)
# Never commit the actual key!
